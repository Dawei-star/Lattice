# 升级门禁（升级计划 P1-10）：Tauri/Web 门禁全绿才允许合并到 main。
# 依据：doc/升级计划/lattice-upgrade-plan.md 4.2 P0-2、4.5 验证标准。
name: upgrade-gate

on:
  pull_request:
    branches: [main, v0.1.5, phase/p1-rust-ai]
  push:
    branches: [main, v0.1.5, phase/p1-rust-ai]
    tags: ['v0.1.*-baseline']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: upgrade-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
      - name: Install dependencies (web)
        run: |
          npm --prefix web ci
      - name: Web test suite
        run: npm --prefix web run test


  rust-test:
    # Tauri 2 依赖 WebView2，Windows runner 无需额外系统包；
    # Linux 另设 rust-test-linux（同一套测试 + WebKitGTK 系统依赖）。
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-gate-${{ hashFiles('src-tauri/Cargo.lock') }}
      - name: cargo test
        working-directory: src-tauri
        run: cargo test --release
      - name: cargo clippy
        working-directory: src-tauri
        run: cargo clippy -- -D warnings

  rust-test-linux:
    # 22.04 与产物构建基线一致（glibc 2.35），验证 Linux 专属 cfg 分支
    # （Secret Service 后端、Unix 权限）在 CI 环境可编译、测试可过。
    # 真实密钥服务回环测试默认跳过（LATTICE_KEYRING_TEST 未设置）。
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux Tauri dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-gate-${{ hashFiles('src-tauri/Cargo.lock') }}
      - name: cargo test
        working-directory: src-tauri
        run: cargo test --release

  desktop-build:
    name: desktop-build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-22.04]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux Tauri dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Install root dependencies
        run: npm ci --ignore-scripts
      - name: Install web dependencies
        run: npm --prefix web ci
      - name: Build desktop bundle
        env:
          # Vite 生产构建 7000+ 模块，默认堆在 2GB 级 runner 上可能触顶
          NODE_OPTIONS: --max-old-space-size=3072
        run: npm run build:desktop
      - name: Upload Linux bundles
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: lattice-linux-${{ github.sha }}
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/rpm/*.rpm
          if-no-files-found: warn

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies (web)
        run: npm --prefix web ci
      - name: TypeScript typecheck
        run: npm --prefix web run typecheck

  eval-gate:
    # W9（地基 ⑧）：金标集基线一致性自检 + 密钥字面量扫描。
    # 纯 node 标准库，无需安装依赖；基线与题集漂移或仓库出现可用凭据字面量即红。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Golden-set baseline regression gate
        run: node src-tauri/eval/regression-gate.mjs
      - name: Secret literal scan
        run: node src-tauri/eval/scan-secrets.mjs
