# 升级门禁（升级计划 P1-10）：Tauri/Web 门禁全绿才允许合并到 main。
# 依据：doc/升级计划/lattice-upgrade-plan.md 4.2 P0-2、4.5 验证标准。
name: upgrade-gate

on:
  pull_request:
    branches: [main, v0.1.5, phase/p1-rust-ai]
  push:
    branches: [main, v0.1.5, phase/p1-rust-ai]
    tags: ['v0.1.*-baseline']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: upgrade-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
      - name: Install dependencies (web)
        run: |
          npm --prefix web ci
      - name: Web test suite
        run: npm --prefix web run test


  rust-test:
    # Tauri 2 依赖 WebView2，Windows runner 无需额外系统包；
    # Mac/Linux 三平台构建环境在 P1-10 前另备（计划 10.3）。
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-gate-${{ hashFiles('src-tauri/Cargo.lock') }}
      - name: cargo test
        working-directory: src-tauri
        run: cargo test --release
      - name: cargo clippy
        working-directory: src-tauri
        run: cargo clippy -- -D warnings

  desktop-build:
    name: desktop-build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-22.04]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux Tauri dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Install root dependencies
        run: npm ci --ignore-scripts
      - name: Install web dependencies
        run: npm --prefix web ci
      - name: Build desktop bundle
        run: npm run build:desktop

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies (web)
        run: npm --prefix web ci
      - name: TypeScript typecheck
        run: npm --prefix web run typecheck
