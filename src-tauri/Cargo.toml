[package]
name = "lattice"
version = "0.2.1"
description = "Local-first knowledge workspace"
license = "MulanPSL-2.0"
repository = "https://github.com/Dawei-star/Lattice"
edition = "2024"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "lattice_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2.7.2", features = [] }
# 把含 Common-Controls v6 依赖的清单补链进 cargo test 测试二进制
# （tauri-build 只链接进 bins，测试二进制缺失 v6 激活上下文会在加载阶段
# 因 comctl32!TaskDialogIndirect 解析失败而 0xC0000139 启动即崩）
embed-resource = "3"

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.3", features = [] }
tauri-plugin-log = "2"
sha2 = "0.10"
tempfile = "3"
walkdir = "2"
tauri-plugin-dialog = "2"
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }
# Vault 单实例锁（advisory file lock，跨平台）
fs2 = "0.4"
# Vault 文件监听（watcher reconcile，P1-03）
notify = "8"
# wiki-link / 标签正则解析（对齐 Express lib/markdown.js）
regex = "1"
# bundled：把 SQLite 源码一起编进来，自带 FTS5 + trigram 分词器，
# 不依赖系统 sqlite3.dll，符合「零外部依赖」的本地优先目标。
rusqlite = { version = "0.40", features = ["bundled"] }
# OpenAI-compatible desktop streaming; API keys are used in memory only.
reqwest = { version = "0.13", default-features = false, features = ["json", "stream", "default-tls", "query"] }
# W1b 密钥服务：Windows 凭据管理器 / macOS 钥匙串 /
# Linux Secret Service（zbus 同步持久后端；crypto-rust 避免引入 libssl）
keyring = { version = "3", features = [
    "windows-native",
    "apple-native",
    "linux-native-sync-persistent",
    "crypto-rust",
] }
rmcp = { version = "3.7.0", features = [
    "client",
    "transport-child-process",
    "transport-streamable-http-client-reqwest",
    "which-command",
] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "process", "io-util", "time", "sync", "macros"] }
